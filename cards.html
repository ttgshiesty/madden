<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Database & Market Tracker | Madden 27 Ultimate Team</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      background: #0a0e14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    .cards-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: #111827;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #1f2937;
      margin-bottom: 24px;
      align-items: center;
    }
    .filter-bar input, .filter-bar select {
      background: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }
    .filter-bar input {
      flex: 1;
      min-width: 200px;
    }
    .cards-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 14px;
      color: #9ca3af;
    }
    .ticker-wrap {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      overflow: hidden;
      white-space: nowrap;
      padding: 8px 0;
    }
    .ticker-inner {
      display: inline-flex;
      gap: 24px;
      animation: ticker 45s linear infinite;
    }
    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }
    .ticker-name { font-weight: 600; color: #f8fafc; }
    .ticker-ovr { color: #38bdf8; }
    .ticker-price { color: #4ade80; font-weight: 600; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand"><a href="/">MADDEN 27 MUT SNIPER</a></div>
    <div class="nav-links">
      <a href="/snipes" class="nav-link">Live Snipes</a>
      <a href="/cards" class="nav-link active">Database (69–86)</a>
      <a href="/binder" class="nav-link">Binder</a>
      <a href="/link-ea" class="nav-cta">Link EA Account</a>
    </div>
  </nav>

  <div class="ticker-wrap">
    <div class="ticker-inner" id="ticker"></div>
  </div>

  <div class="cards-container">
    <div class="filter-bar">
      <input type="text" id="cardSearch" placeholder="Search player name (e.g. Tariq Woolen, Dart, Sanders)...">
      <select id="posFilter">
        <option value="">All Positions</option>
      </select>
      <select id="progFilter">
        <option value="">All Programs</option>
      </select>
      <select id="ovrFilter">
        <option value="">All OVRs (69–86)</option>
        <option value="86">86 OVR</option>
        <option value="85">85 OVR</option>
        <option value="84">84 OVR</option>
        <option value="83">83 OVR</option>
        <option value="82">82 OVR</option>
        <option value="80+">80+ OVR</option>
        <option value="75+">75+ OVR</option>
        <option value="70+">70+ OVR</option>
      </select>
      <select id="sortFilter">
        <option value="ovr">Highest OVR</option>
        <option value="price_asc">Cheapest Buy Now</option>
        <option value="price_desc">Highest Price</option>
        <option value="sold_median">MUT.GG Sold Median</option>
        <option value="name_asc">Player Name (A–Z)</option>
      </select>
    </div>

    <div class="cards-meta-row">
      <div id="cardsMeta">Loading player database...</div>
      <div id="catalogCount"></div>
    </div>

    <div id="cardsGrid" class="cards-grid"></div>
    <div id="pagination" class="pagination"></div>
  </div>

  <script src="/img-proxy.js"></script>
  <script src="/binder-client.js"></script>
  <script src="/alert-modal.js"></script>
  <script src="/cards.js"></script>
  <script src="/nav.js"></script>
</body>
</html>
